<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Admin | Storage profile', ~{::link.page-css})}">
    <link class="page-css" rel="stylesheet" th:href="@{/css/app-shell.css}">
    <link class="page-css" rel="stylesheet" th:href="@{/css/class-detail.css}">
    <link class="page-css" rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<header th:replace="~{fragments/app-header :: appHeader('admin')}"></header>
<div class="class-detail-layout">
    <aside th:replace="~{fragments/admin-sidebar :: adminSidebar('settings')}"></aside>
    <main class="col">
        <nav class="settings-breadcrumb"><a th:href="@{/admin/settings/storage-profiles}">Storage profiles</a><span class="sep">/</span><span th:text="${form.profileCode}">Profile</span></nav>
        <h1 class="detail-title" th:text="${form.profileCode}">Storage profile</h1>
        <form method="post" th:action="@{/admin/settings/storage-profiles}" th:object="${form}" class="users-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" th:field="*{profileCode}"><input type="hidden" th:field="*{revision}">
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}">Error</div>
            <section class="detail-card">
                <div class="form-row"><label for="backend">Backend</label><select id="backend" th:field="*{backend}"><option value="LOCAL">LOCAL</option><option value="R2">R2</option></select></div>
                <div class="form-row"><label for="keyPrefix">Key prefix</label><input id="keyPrefix" th:field="*{keyPrefix}" readonly><p class="field-hint">Identity bất biến; object key không được thoát prefix này.</p></div>
                <div class="form-row"><label for="accountId">R2 account ID</label><input id="accountId" th:field="*{accountId}" maxlength="128" autocomplete="off"></div>
                <div class="form-row"><label for="accessKeyId">R2 access key ID</label><input id="accessKeyId" th:field="*{accessKeyId}" maxlength="255" autocomplete="off"></div>
                <div class="form-row"><label for="secretAccessKey">R2 secret access key</label><input id="secretAccessKey" type="password" th:field="*{secretAccessKey}" maxlength="4096" autocomplete="new-password"><button th:if="${mode == 'edit'}" type="button" class="btn-ghost js-storage-profile-reveal" th:attr="data-profile-code=*{profileCode}" aria-pressed="false">Hiện / ẩn secret</button><p class="field-hint">Để trống hoặc giữ ******** để giữ secret hiện tại.</p></div>
                <div class="form-row"><label for="bucket">Private bucket</label><input id="bucket" th:field="*{bucket}" maxlength="255" autocomplete="off"></div>
                <div class="form-row"><label for="endpoint">R2 endpoint</label><input id="endpoint" th:field="*{endpoint}" maxlength="512" autocomplete="off" placeholder="https://…r2.cloudflarestorage.com"></div>
                <div class="form-row"><label for="region">Region</label><input id="region" th:field="*{region}" maxlength="64" autocomplete="off"></div>
                <div class="form-row"><label><input type="checkbox" th:field="*{enabled}"> Enabled</label></div>
                <button class="btn btn-primary" type="submit">Lưu profile</button>
                <a class="btn-ghost" th:href="@{/admin/settings/storage-profiles}">Hủy</a>
            </section>
        </form>
    </main>
</div>
<div id="storageProfileActionResult" class="sr-only" role="status" aria-live="polite"></div>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/admin.js}"></script>
<script th:src="@{/js/admin-settings-storage-profiles.js}"></script>
</body>
</html>
