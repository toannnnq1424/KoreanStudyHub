<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Trưởng môn | Chi tiết môn học', ~{::link.page-css})}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/app-shell.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/class-detail.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/detail-page.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/admin.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/leader-subject.css}">
</head>
<body class="leader-page leader-managed-subjects-page">
<header th:replace="~{fragments/app-header :: appHeader('leader')}"></header>
<div class="class-detail-layout leader-workspace">
  <aside th:replace="~{fragments/leader-sidebar :: leaderSidebar('subjects')}"></aside>
  <main class="col leader-main">
    <a class="leader-subject-back" th:href="@{/leader/subjects}">← Danh sách môn học</a>
    <div class="leader-page-heading">
      <span>
        <h1 class="detail-title" th:text="${managedSubject.name()}">Tên môn học</h1>
        <p class="detail-sub">Thông tin môn học bạn đang phụ trách.</p>
      </span>
    </div>
    <section class="leader-managed-subject-detail" aria-label="Thông tin môn học">
      <dl>
        <div><dt>Mã môn học</dt><dd><code class="leader-subject-code" th:text="${managedSubject.code()}">CODE</code></dd></div>
        <div><dt>Tên môn học</dt><dd th:text="${managedSubject.name()}">Tên môn học</dd></div>
        <div><dt>Mô tả</dt><dd th:text="${managedSubject.description() != null and !managedSubject.description().isBlank() ? managedSubject.description() : 'Chưa có mô tả.'}">Mô tả</dd></div>
      </dl>
      <a class="leader-managed-subject-action" th:href="@{/leader/question-bank(subjectId=${managedSubject.id()})}">Mở Ngân hàng câu hỏi</a>
    </section>
  </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
