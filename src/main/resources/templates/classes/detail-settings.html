<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${clazz.name} + ' | Cài đặt', ~{::link.page-css})}">
  <!-- CSS load order matters: app-shell → class-detail (legacy detail rules)
       → detail-page (design system) → admin (base form-row input/select
       styles consumed by .detail-form-grid) → classes (form widgets). Keep this sequence in sync with
       docs/design-system/detail-page-pattern.md §3. -->
  <link class="page-css" rel="stylesheet" th:href="@{/css/app-shell.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/class-detail.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/detail-page.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/admin.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/classes.css}">
</head>
<body>
<header th:replace="~{fragments/app-header :: appHeader('classes')}"></header>

<!-- Flash drain: surfaces server-flashed messages (success/error) as toasts
     via class-detail.js. -->
<span id="flash-data"
      th:attr="data-flash-success=${flashSuccess},data-flash-error=${flashError}"
      style="display:none;"></span>

<div class="class-detail-layout">
  <aside th:replace="~{fragments/class-sidebar :: classSidebar(${clazz}, 'settings')}"></aside>

  <!-- The `.detail-page` modifier sheds the legacy width clamp from
       `.class-detail-layout .col` so the toolbar / cards stretch to the
       full content column. -->
  <main class="col detail-page">

    <!-- ═══ Sticky toolbar ═══════════════════════════════════════════════
         Three primary actions: Quay lại / Lưu / Xoá. The Save button uses
         HTML5 form association (form="classEditForm") so it submits the
         info form that lives later in the DOM.
         ══════════════════════════════════════════════════════════════════ -->
    <div class="detail-toolbar"
         th:attr="data-class-id=${clazz.id}, data-class-name=${clazz.name}">
      <a th:href="@{/lecturer/classes}" class="toolbar-back">
        <svg class="ico ico-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
        </svg>
        Quay lại
      </a>
      <span class="toolbar-spacer"></span>
      <button type="submit"
              form="classEditForm"
              class="btn-primary toolbar-save"
              th:disabled="${activeDetailTab != 'info'}">Lưu</button>
      <button type="button"
              class="btn-danger toolbar-delete"
              data-action="delete-class">Xóa lớp</button>
    </div>

    <!-- ═══ Header (title + status pill + meta dates) ═══════════════════ -->
    <h1 class="detail-page-title" th:text="${clazz.name}">Tên lớp</h1>
    <div class="detail-page-meta">
      <div class="meta-badges">
        <span class="status-pill"
              th:classappend="${'status-' + #strings.toLowerCase(clazz.status)}"
              th:text="${clazz.status}">STATUS</span>
        <span class="code-badge" th:text="'Mã lớp: ' + ${clazz.code}">Mã lớp: CODE</span>
      </div>
      <span>Tạo lúc:
        <em th:text="${clazz.createdAt != null ? #temporals.format(clazz.createdAt, 'dd/MM/yyyy HH:mm') : '—'}">—</em>
      </span>
    </div>

    <!-- ═══ Tab pill strip — switched by detail-tabs.js (AJAX) ═══════════ -->
    <nav class="detail-tabs" aria-label="Phần cài đặt lớp">
      <a class="detail-tab"
         th:href="@{'/lecturer/classes/' + ${clazz.id} + '/settings'(tab='info')}"
         th:classappend="${activeDetailTab == 'info'} ? 'active'">Thông tin lớp</a>
    </nav>

    <!-- Tab body — swapped in place by detail-tabs.js on tab switch. -->
    <div id="tabPanel">

    <!-- ═══ Info tab — class edit form ═══════════════════════════════════
         The form wraps two section cards (basic info, schedule + capacity).
         The toolbar Lưu button (form="classEditForm") submits it.
         ══════════════════════════════════════════════════════════════════ -->
    <div th:if="${activeDetailTab == 'info'}">
      <form id="classEditForm"
            th:action="@{${formAction}}"
            method="post"
            th:object="${form}"
            novalidate>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" th:field="*{departmentId}">

        <section class="detail-card">
          <h2 class="detail-card-title">Thông tin lớp</h2>
          <div class="detail-form-grid">
            <div class="form-row span-2">
              <label for="nameInput">Tên lớp <span class="required" aria-hidden="true">*</span></label>
              <input id="nameInput" type="text" th:field="*{name}"
                     th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                     th:attr="aria-invalid=${#fields.hasErrors('name')} ? 'true' : 'false', aria-describedby=${#fields.hasErrors('name')} ? 'name-error' : ''"
                     maxlength="300" required aria-required="true">
              <p id="name-error" class="field-error" role="alert"
                 th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}">Lỗi tên</p>
            </div>
            <div class="form-row span-3">
              <label for="descriptionInput">Mô tả</label>
              <textarea id="descriptionInput" th:field="*{description}"
                        th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"
                        rows="4"
                        placeholder="Mô tả ngắn về lớp học (tối đa 2000 ký tự)"></textarea>
              <p class="field-error" role="alert"
                 th:if="${#fields.hasErrors('description')}"
                 th:errors="*{description}">Lỗi mô tả</p>
            </div>
          </div>
        </section>

        <section class="detail-card">
          <h2 class="detail-card-title">Lịch trình &amp; sĩ số</h2>
          <div class="detail-form-grid">
            <div class="form-row">
              <label>Ngày tạo lớp</label>
              <input type="text"
                     th:value="${clazz.createdAt != null ? #temporals.format(clazz.createdAt, 'dd/MM/yyyy') : '—'}"
                     disabled>
            </div>
            <div class="form-row">
              <label for="endDateInput">Ngày kết thúc</label>
              <input id="endDateInput" type="date" th:field="*{endDate}"
                     th:classappend="${#fields.hasErrors('endDate')} ? 'is-invalid' : ''">
              <p class="field-error" role="alert"
                 th:if="${#fields.hasErrors('endDate')}"
                 th:errors="*{endDate}">Lỗi ngày kết thúc</p>
            </div>
            <div class="form-row">
              <label for="maxStudentsInput">Sĩ số tối đa</label>
              <input id="maxStudentsInput" type="number" th:field="*{maxStudents}"
                     th:classappend="${#fields.hasErrors('maxStudents')} ? 'is-invalid' : ''"
                     min="1" max="1000" placeholder="100">
              <p class="field-error" role="alert"
                 th:if="${#fields.hasErrors('maxStudents')}"
                 th:errors="*{maxStudents}">Lỗi sĩ số</p>
            </div>
          </div>
        </section>
      </form>
    </div>

    </div><!-- /#tabPanel -->

    <!-- ═══ Hidden delete form — submitted by toolbar "Xóa lớp" ═════════
         class-detail.js wires the toolbar button to KshModal.confirm and
         submits this form on confirmation. Lives outside #tabPanel. -->
    <form th:id="'form-delete-' + ${clazz.id}"
          th:action="@{'/lecturer/classes/' + ${clazz.id} + '/delete'}"
          method="post" style="display:none;">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    </form>
  </main>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/class-detail.js}"></script>
<script th:src="@{/js/detail-tabs-dirty-guard.js}"></script>
<script th:src="@{/js/detail-tabs.js}"></script>
</body>
</html>
