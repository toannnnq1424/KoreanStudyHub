<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${clazz.name} + ' | Bảng tin', ~{::link.page-css})}">
    <link class="page-css" rel="stylesheet" th:href="@{/css/app-shell.css}">
    <link class="page-css" rel="stylesheet" th:href="@{/css/class-detail.css}">
    <link class="page-css" rel="stylesheet" th:href="@{/css/pager.css}">
    <link class="page-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css">
</head>
<body>
<header th:replace="~{fragments/app-header :: appHeader('classes')}"></header>

<span id="flash-data"
      th:attr="data-flash-success=${flashSuccess},data-flash-error=${flashError}"
      style="display:none;"></span>

<div class="class-detail-layout">
    <aside th:replace="~{fragments/class-sidebar :: classSidebar(${clazz}, 'board')}"></aside>

    <main class="col">
        <h1 class="detail-title">Bảng tin</h1>

        <!-- The hidden input is the field actually submitted; Quill live-syncs
             into it on every text-change, so the form needs no submit handler.
             data-compose-open starts the box expanded when a validation error came
             back, so the rejected draft and its message stay visible. -->
        <section class="ann-compose" data-announcement-compose
                 th:attr="data-compose-open=${flashError} ? 'true' : 'false'">
            <!-- The image upload endpoint is class-scoped, so the script cannot
                 hardcode it; it reads exactly this attribute. -->
            <form method="post" data-announcement-form
                  th:attr="data-image-url=@{'/lecturer/classes/' + ${clazz.id} + '/announcements/images'}"
                  th:action="@{'/lecturer/classes/' + ${clazz.id} + '/announcements'}">

                <div class="ann-compose-prompt">
          <span class="ann-avatar ann-avatar-me" aria-hidden="true"
                th:style="'background:' + ${T(com.ksh.utils.AvatarStyles).gradient(#authentication.principal.id)}"
                th:text="${T(com.ksh.utils.AvatarStyles).label(#authentication.principal.fullName)}">??</span>
                    <button type="button" class="ann-compose-trigger" data-announcement-open>
                        Bạn muốn thông báo điều gì?
                    </button>
                </div>

                <div class="ann-compose-body">
                    <p class="ann-compose-label">Đăng thông báo mới</p>
                    <input type="hidden" name="content" data-announcement-value
                           th:value="${announcementForm}">
                    <div id="announcementEditor" data-announcement-editor
                         aria-label="Trình soạn thảo thông báo"></div>
                    <p class="ann-error" th:if="${flashError}" th:text="${flashError}"></p>
                    <div class="ann-compose-actions">
                        <!-- Delegates to the Quill toolbar's image handler so the footer
                             affordance and the toolbar button share one upload path. -->
                        <button type="button" class="ann-image-btn" data-announcement-image>
                            <svg class="ann-image-ico" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M4 5h16v14H4z"/>
                                <circle cx="9" cy="10" r="1.5"/>
                                <path d="M6 17l4-4 3 3 2-2 3 3z"/>
                            </svg>
                            Thêm hình ảnh
                        </button>
                        <!-- Starts disabled; the script enables it once the editor holds
                             content. Kept enabled server-side only when a draft came back. -->
                        <button type="submit" class="btn btn-primary" data-announcement-submit
                                th:attr="disabled=${announcementForm != null and !#strings.isEmpty(announcementForm)} ? null : 'disabled'">
                            Đăng thông báo
                        </button>
                    </div>
                </div>
            </form>
        </section>

        <!-- Empty state renders only when the feed genuinely holds no rows. -->
        <section class="ann-empty" th:if="${announcementsPage.totalElements == 0}">
            <svg class="ann-empty-ico" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 5h16v11H8l-4 3V5z"/>
            </svg>
            <h2>Chưa có thông báo nào</h2>
            <p>Thông báo bạn đăng sẽ hiển thị tại đây và gửi tới học viên trong lớp.</p>
        </section>

        <section class="ann-feed" th:if="${announcementsPage.totalElements > 0}">
            <article class="ann-item" th:each="ann : ${announcementsPage.content}">
                <header class="ann-item-head">
          <span class="ann-avatar" aria-hidden="true"
                th:style="'background:' + ${ann.avatarGradient()}"
                th:text="${ann.avatarLabel()}">??</span>
                    <div class="ann-item-meta">
                        <span class="ann-author" th:text="${ann.displayAuthor()}">—</span>
                        <span class="ann-submeta">
              <span class="ann-stamp" th:text="${ann.displayCreatedAt()}">—</span>
              <span class="ann-edited" th:if="${ann.edited()}">· (đã chỉnh sửa)</span>
            </span>
                    </div>

                    <!-- Manage actions live in a kebab menu so the card body stays clean;
                         rendered only for authors/moderators, same gate as before. -->
                    <div class="ann-menu" data-ann-menu th:if="${ann.canManage()}">
                        <button type="button" class="ann-menu-trigger" data-ann-menu-trigger
                                aria-haspopup="true" aria-expanded="false"
                                aria-label="Tuỳ chọn thông báo">
                            <svg class="ann-menu-ico" viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="5" cy="12" r="2"/>
                                <circle cx="12" cy="12" r="2"/>
                                <circle cx="19" cy="12" r="2"/>
                            </svg>
                        </button>
                        <div class="ann-menu-panel" data-ann-menu-panel hidden>
                            <button type="button" class="ann-menu-item" data-ann-edit-toggle>
                                Chỉnh sửa
                            </button>
                            <!-- Submits the sibling delete form below; a native confirm()
                                 would block, so the menu asks for a second click instead. -->
                            <button type="submit" class="ann-menu-item ann-menu-item-danger"
                                    th:form="'announcementDelete' + ${ann.id()}"
                                    data-ann-delete-confirm
                                    data-ann-label-idle="Xoá"
                                    data-ann-label-confirm="Bấm lần nữa để xoá">
                                Xoá
                            </button>
                        </div>
                    </div>
                </header>

                <!-- Content is sanitized on write, so utext is safe here. -->
                <div class="ann-body" th:utext="${ann.content()}"></div>

                <div class="ann-edit" data-ann-edit hidden th:if="${ann.canManage()}">
                    <form method="post"
                          th:action="@{'/lecturer/classes/' + ${clazz.id} + '/announcements/' + ${ann.id()}}">
                        <label class="ann-edit-label"
                               th:for="'announcementEdit' + ${ann.id()}">Nội dung thông báo</label>
                        <textarea class="ann-edit-input" name="content" rows="6"
                                  th:id="'announcementEdit' + ${ann.id()}"
                                  th:text="${ann.content()}"></textarea>
                        <div class="ann-edit-actions">
                            <button type="button" class="btn btn-sm" data-ann-edit-cancel>Huỷ</button>
                            <button type="submit" class="btn btn-sm btn-primary">Lưu thay đổi</button>
                        </div>
                    </form>
                </div>

                <!-- Kept outside the menu panel so the menu can close without tearing
                     down the form the kebab's delete item targets via @form. -->
                <form method="post" class="ann-delete-form" th:if="${ann.canManage()}"
                      th:id="'announcementDelete' + ${ann.id()}"
                      th:action="@{'/lecturer/classes/' + ${clazz.id} + '/announcements/' + ${ann.id()} + '/delete'}"></form>

                <section class="ann-comments">
                    <p class="ann-comment-count" th:text="${ann.displayCommentCount()}">0 bình luận</p>

                    <!-- Comment bodies are plain text: th:text, never th:utext. That is
                         the only thing standing between a student-authored comment and
                         stored XSS. -->
                    <div class="ann-comment" th:each="c : ${ann.comments()}">
            <span class="ann-avatar ann-avatar-sm" aria-hidden="true"
                  th:style="'background:' + ${c.avatarGradient()}"
                  th:text="${c.avatarLabel()}">??</span>
                        <div class="ann-comment-main">
                            <div class="ann-comment-bubble">
                                <span class="ann-comment-author" th:text="${c.displayAuthor()}">—</span>
                                <span class="ann-comment-text" th:text="${c.content()}">—</span>
                            </div>
                            <div class="ann-comment-meta">
                                <span class="ann-comment-stamp" th:text="${c.displayCreatedAt()}">—</span>
                                <!-- Hiding this control is UX only; the server re-checks. -->
                                <form method="post" class="ann-comment-delete" th:if="${c.canDelete()}"
                                      th:action="@{'/lecturer/classes/' + ${clazz.id} + '/announcements/' + ${ann.id()} + '/comments/' + ${c.id()} + '/delete'}">
                                    <button type="submit" class="ann-comment-delete-btn">Xoá</button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <form method="post" class="ann-comment-form"
                          th:action="@{'/lecturer/classes/' + ${clazz.id} + '/announcements/' + ${ann.id()} + '/comments'}">
            <span class="ann-avatar ann-avatar-sm ann-avatar-me" aria-hidden="true"
                  th:style="'background:' + ${T(com.ksh.utils.AvatarStyles).gradient(#authentication.principal.id)}"
                  th:text="${T(com.ksh.utils.AvatarStyles).label(#authentication.principal.fullName)}">??</span>
                        <div class="ann-comment-input-wrap">
                            <input type="text" name="content" class="ann-comment-input"
                                   placeholder="Viết bình luận…" maxlength="2000"
                                   th:value="${commentForm != null and commentForm.announcementId() == ann.id()}
                               ? ${commentForm.rejectedContent()} : ''">
                            <!-- Field validation renders inline here, never as a toast. -->
                            <p class="ann-error ann-comment-error"
                               th:if="${commentForm != null and commentForm.announcementId() == ann.id()}"
                               th:text="${commentForm.errorMessage()}"></p>
                        </div>
                        <button type="submit" class="btn btn-sm btn-primary">Gửi</button>
                    </form>
                </section>
            </article>

            <div th:replace="~{fragments/pager :: pager(${announcementsPage}, '/lecturer/classes/' + ${clazz.id} + '/board', ${params})}"></div>
        </section>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js" defer></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/class-detail.js}"></script>
<!-- flashcard-common supplies FcCommon.postForm, which the Quill image helper
     uses to upload; test-lecturer-form-quill exports window.LfQuill. Both must
     load before the board script consumes LfQuill.createQuill. -->
<script th:src="@{/js/flashcard-common.js}" defer></script>
<script th:src="@{/js/test-lecturer-form-quill.js}" defer></script>
<script th:src="@{/js/class-announcement-form.js}" defer></script>
</body>
</html>
