# Database-backed tests must opt in to an explicitly disposable catalog.
# This higher-precedence test resource never reads DB_URL/ksh_db.
spring.datasource.url=${TEST_DB_URL}
spring.datasource.username=${TEST_DB_USERNAME}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# The suite caches multiple Spring contexts. Keep each disposable-test context
# small so it cannot exhaust the shared local MySQL connection limit.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
app.practice.speaking-media.upload-api-enabled=false
app.practice.speaking-media.playback-api-enabled=false

# Keep test-created public objects away from the developer upload directory.
# Callers can still supply an isolated per-run path when parallel contexts need it.
app.upload.dir=${TEST_UPLOAD_DIR:target/test-uploads}
app.storage-profiles.allow-local=true

# Tests invoke the processor explicitly. Background polling is disabled so a
# context refresh can never discover retained jobs and call a provider.
app.practice.attempt-evaluation.worker-enabled=false
app.practice.attempt-deadline.worker-enabled=false
app.practice.explanation-generation.worker-enabled=false
