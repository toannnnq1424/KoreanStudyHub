<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${view.className()} + ' — Bài test', ~{::link.page-css})}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/app-shell.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/detail-page.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/student-lessons.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/test-list.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/student-class-tests.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/pager.css}">
</head>
<body>
<header th:replace="~{fragments/app-header :: appHeader('my-classes')}"></header>

<main class="student-lessons-shell">
  <!-- 2-column layout: shared class sidebar (left) + tests panel (right). -->
  <div class="student-class-tests-grid">
    <!-- LEFT SIDEBAR: shared class shell sidebar, 'tests' tab active. No
         progress bar or lessons-only extras, so both slots are the no-op ~{}. -->
    <div th:replace="~{fragments/student-class-sidebar :: classSidebar('tests', ${view.classId()}, ${view.className()}, ${view.classCode()}, ${view.lecturerName()}, ~{}, ~{})}"></div>

    <!-- MAIN: search toolbar + test cards + pager. -->
    <section class="student-lessons-main">
      <div class="tst-toolbar">
        <h2 class="tst-page-title">Bài test</h2>
        <form class="tst-search" method="get" th:action="@{|/my/classes/${view.classId()}/tests|}">
          <svg class="ico ico-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/>
          </svg>
          <input type="text" name="q" th:value="${view.query()}"
                 placeholder="Tìm bài test theo tên" aria-label="Tìm bài test">
        </form>
      </div>

      <!-- Empty state: distinguishes "no match for search" from "class has none". -->
      <div class="tst-empty" th:if="${view.exams().totalElements == 0}">
        <span th:if="${#strings.isEmpty(view.query())}">Lớp này chưa có bài test nào.</span>
        <span th:unless="${#strings.isEmpty(view.query())}"
              th:text="'Không tìm thấy bài test nào khớp với &quot;' + ${view.query()} + '&quot;.'">Không tìm thấy</span>
      </div>

      <div class="tst-table-wrap student-test-table-wrap" th:if="${view.exams().totalElements > 0}">
        <table class="tst-table student-test-table">
          <thead>
          <tr><th>Bài test</th><th>Loại</th><th>Thời lượng</th><th>Trạng thái</th><th>Điểm</th><th aria-label="Thao tác"></th></tr>
          </thead>
          <tbody>
          <tr th:each="exam : ${view.exams().content}">
            <td><strong th:text="${exam.title()}">Tên bài test</strong><small th:text="${exam.totalQuestions()} + ' câu hỏi'">0 câu hỏi</small></td>
            <td><span class="tst-badge" th:classappend="'tst-badge-' + ${exam.type()}" th:text="${exam.type()}">MODULE</span></td>
            <td th:text="${exam.timeMode() == 'INDIVIDUAL' and exam.durationMinutes() != null ? exam.durationMinutes() + ' phút' : 'Khung giờ chung'}">20 phút</td>
            <td><span class="tst-attempt-pill tst-attempt-active" th:if="${exam.lastAttemptStatus() == 'IN_PROGRESS'}">Đang làm</span><span class="tst-attempt-pill tst-attempt-done" th:if="${exam.lastAttemptStatus() == 'SUBMITTED' or exam.lastAttemptStatus() == 'TIMED_OUT'}">Đã hoàn thành</span><span class="tst-attempt-pill" th:if="${exam.lastAttemptStatus() == null}">Chưa làm</span></td>
            <td th:text="${exam.bestScorePercent() != null ? exam.bestScorePercent() + '%' : '—'}">—</td>
            <td class="tst-row-actions">
              <a class="tst-icon-action" title="Xem chi tiết" aria-label="Xem chi tiết" th:href="@{|/my/classes/${view.classId()}/tests/${exam.id()}|}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></a>
              <form class="tst-action-form" method="post" th:if="${exam.lastAttemptStatus() == null}" th:action="@{|/my/classes/${view.classId()}/tests/${exam.id()}/start|}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="tst-icon-action" type="submit" title="Làm bài" aria-label="Làm bài"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z"/></svg></button></form>
              <a class="tst-icon-action" title="Tiếp tục làm bài" aria-label="Tiếp tục làm bài" th:if="${exam.lastAttemptStatus() == 'IN_PROGRESS'}" th:href="@{|/my/classes/${view.classId()}/tests/${exam.id()}/take|}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z"/></svg></a>
              <a class="tst-icon-action" title="Xem kết quả chi tiết" aria-label="Xem kết quả chi tiết" th:if="${exam.lastCompletedAttemptId() != null}" th:href="@{|/my/classes/${view.classId()}/tests/${exam.id()}/result/${exam.lastCompletedAttemptId()}|}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 3-3 3 2 5-6"/></svg></a>
            </td>
          </tr>
          </tbody>
        </table>
      </div>

      <!-- Shared SSR numbered pager; preserves ?q via the params map. -->
      <div th:replace="~{fragments/pager :: pager(${view.exams()}, |/my/classes/${view.classId()}/tests|, ${params})}"></div>
    </section>
  </div>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
