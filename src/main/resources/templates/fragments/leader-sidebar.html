<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!--
  Fragment: leaderSidebar(activeTab)
    activeTab : 'dashboard' | 'approvals' | 'report' | 'question-bank'
    -->
<aside th:fragment="leaderSidebar(activeTab)" class="col">
  <div class="side">
    <div class="class-head">
      <div class="class-name">Trưởng bộ môn</div>
      <div class="class-ma" th:if="${leaderDepartment != null}"
           th:text="${leaderDepartment.code() + ' — ' + leaderDepartment.name()}">BM</div>
      <div class="class-ma" th:if="${leaderDepartment == null}">Chưa gán bộ môn</div>
    </div>

    <div class="side-sep"></div>
    <p class="menu-title">Bộ môn</p>

    <ul class="side-nav">
      <li>
        <a th:href="@{/leader}"
           th:classappend="${activeTab == 'dashboard'} ? 'active' : ''">
            Dashboard
        </a>
      </li>
      <li>
        <a th:href="@{/leader/approvals}"
           th:classappend="${activeTab == 'approvals'} ? 'active' : ''">
            Duyệt lớp
        </a>
<!--      </li>-->
<!--      <li>-->
<!--        <a th:href="@{/leader/assign}"-->
<!--           th:classappend="${activeTab == 'assign'} ? 'active' : ''">-->
<!--          Phân công GV-->
<!--        </a>-->
      </li>
      <li>
        <a th:href="@{/leader/report}"
           th:classappend="${activeTab == 'report'} ? 'active' : ''">
          Báo cáo
        </a>
      </li>
      <li>
        <a th:href="@{/leader/question-bank}"
           th:classappend="${activeTab == 'question-bank'} ? 'active' : ''">
          Ngân hàng câu hỏi
        </a>
      </li>
    </ul>
  </div>
</aside>
</html>
