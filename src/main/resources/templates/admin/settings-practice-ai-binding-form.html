<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Admin | Practice AI binding', ~{::link.page-css})}">
    <link class="page-css" rel="stylesheet" th:href="@{/css/app-shell.css}">
    <link class="page-css" rel="stylesheet" th:href="@{/css/class-detail.css}">
    <link class="page-css" rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<header th:replace="~{fragments/app-header :: appHeader('admin')}"></header>
<div class="class-detail-layout">
    <aside th:replace="~{fragments/admin-sidebar :: adminSidebar('settings')}"></aside>
    <main class="col">
        <nav class="settings-breadcrumb"><a th:href="@{/admin/settings/practice-ai}">Practice AI</a><span class="sep">/</span><span th:text="${purpose}">Purpose</span></nav>
        <h1 class="detail-title" th:text="${purpose}">Purpose binding</h1>
        <p class="detail-sub" th:text="${purpose.displayName() + ' — required: ' + requiredCapabilities}">Capabilities</p>
        <div class="alert alert-warning" th:if="${#lists.isEmpty(profiles)}">Tạo provider profile trước khi lưu binding.</div>
        <form method="post" th:action="@{'/admin/settings/practice-ai/bindings/' + ${purpose}}" th:object="${form}" class="users-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" th:field="*{purpose}"><input type="hidden" th:field="*{revision}">
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}">Error</div>
            <section class="detail-card">
                <div class="form-row"><label for="providerProfileId">Provider profile</label><select id="providerProfileId" th:field="*{providerProfileId}" required><option value="">-- Chọn --</option><option th:each="profile : ${profiles}" th:value="${profile.id}" th:text="${profile.profileCode + ' — ' + profile.displayName}"></option></select><p class="field-error" th:errors="*{providerProfileId}"></p></div>
                <div class="form-row"><label for="model">Model</label><input id="model" th:field="*{model}" maxlength="150" required><p class="field-error" th:errors="*{model}"></p></div>
                <div class="form-row" th:if="${purpose.name() == 'PRACTICE_PDF_AUTHORING'}"><label><input type="checkbox" th:field="*{pdfImageInput}"> Khai báo và kiểm thử image input</label></div>
                <div class="form-row"><label for="retentionCode">Retention code</label><input id="retentionCode" th:field="*{retentionCode}" maxlength="64" required><p class="field-error" th:errors="*{retentionCode}"></p></div>
                <div class="form-row"><label for="connectTimeoutMs">Connect timeout ms</label><input id="connectTimeoutMs" type="number" th:field="*{connectTimeoutMs}" min="100" max="30000"></div>
                <div class="form-row"><label for="readTimeoutMs">Read timeout ms</label><input id="readTimeoutMs" type="number" th:field="*{readTimeoutMs}" min="1000" max="120000"></div>
                <div class="form-row"><label for="maxRetries">Retries cùng binding</label><input id="maxRetries" type="number" th:field="*{maxRetries}" min="0" max="3"></div>
                <div class="form-row"><label for="maxRequestBytes">Max request bytes</label><input id="maxRequestBytes" type="number" th:field="*{maxRequestBytes}" min="1" max="26214400"></div>
                <div class="form-row"><label for="maxResponseBytes">Max response bytes</label><input id="maxResponseBytes" type="number" th:field="*{maxResponseBytes}" min="16384" max="8388608"></div>
                <div class="form-row"><label><input type="checkbox" th:field="*{enabled}"> Enabled</label></div>
                <button class="btn btn-primary" type="submit" th:disabled="${#lists.isEmpty(profiles)}">Lưu binding</button>
                <a class="btn-ghost" th:href="@{/admin/settings/practice-ai}">Hủy</a>
            </section>
        </form>
    </main>
</div>
</body>
</html>
