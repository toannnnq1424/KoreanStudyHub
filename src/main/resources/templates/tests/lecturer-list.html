<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Quản lý bài test', ~{::link.page-css})}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/app-shell.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/test-list.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/pager.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/learning-ui.css}">
</head>
<body>
<header th:replace="~{fragments/app-header :: appHeader('tests')}"></header>

<span id="flash-data"
      th:attr="data-flash-success=${flashSuccess},data-flash-error=${flashError}"
      style="display:none;"></span>

<main class="tst-page">
  <div class="tst-toolbar">
    <h1 class="tst-page-title">Quản lý bài test</h1>
    <a class="tst-btn tst-btn-primary" th:href="@{/lecturer/tests/new}">Tạo bài test</a>
  </div>

  <section class="tst-section">
    <form method="get" class="tst-filter-grid">
      <label class="sr-only" for="testSearch">Tìm theo tiêu đề bài test</label>
      <input class="tst-input" id="testSearch" type="search" name="q" placeholder="Tìm theo tiêu đề"
             th:value="${examFilter.keyword()}">
      <label class="sr-only" for="testStatus">Lọc theo trạng thái</label>
      <select class="tst-input" id="testStatus" name="status" data-ksh-select>
        <option value="">Mọi trạng thái</option>
        <option value="DRAFT" th:selected="${examFilter.status() == 'DRAFT'}">Bản nháp</option>
        <option value="PUBLISHED" th:selected="${examFilter.status() == 'PUBLISHED'}">Đã xuất bản</option>
        <option value="ARCHIVED" th:selected="${examFilter.status() == 'ARCHIVED'}">Đã lưu trữ</option>
      </select>
      <label class="sr-only" for="testType">Lọc theo loại bài test</label>
      <select class="tst-input" id="testType" name="type" data-ksh-select>
        <option value="">Mọi loại</option>
        <option value="MOCK" th:selected="${examFilter.type() == 'MOCK'}">Thi thử</option>
        <option value="MODULE" th:selected="${examFilter.type() == 'MODULE'}">Theo học phần</option>
        <option value="PRACTICE" th:selected="${examFilter.type() == 'PRACTICE'}">Luyện tập</option>
      </select>
      <label class="sr-only" for="testClass">Lọc theo lớp</label>
      <select class="tst-input" id="testClass" name="classId" data-ksh-select
              data-ksh-searchable data-ksh-search-placeholder="Gõ tên lớp…">
        <option value="">Mọi lớp</option>
        <option th:each="clazz : ${ledClasses}" th:value="${clazz.id()}"
                th:text="${clazz.name()}" th:selected="${examFilter.classId() == clazz.id()}">Lớp</option>
      </select>
      <button class="tst-btn" type="submit">Lọc</button>
    </form>
    <div class="tst-empty" th:if="${examsPage.totalElements == 0}">
      Bạn chưa tạo bài test nào.
    </div>

    <div class="tst-table-wrap" th:if="${examsPage.totalElements > 0}">
    <table class="tst-table">
      <thead>
      <tr>
        <th>Tiêu đề</th><th>Loại</th><th>Trạng thái</th><th>Lớp</th>
        <th>Số câu</th><th>Thao tác</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="exam : ${examsPage.content}">
        <td th:text="${exam.title()}">Tên</td>
        <td><span class="tst-badge" th:classappend="'tst-badge-' + ${exam.type()}"
                  th:text="${exam.type()}">MOCK</span></td>
        <td><span class="tst-status" th:classappend="'tst-status-' + ${exam.status()}"
                  th:text="${exam.status()}">DRAFT</span></td>
        <td th:text="${exam.className()}">Lớp</td>
        <td th:text="${exam.totalQuestions()}">0</td>
        <td class="tst-row-actions">
          <a th:href="@{|/lecturer/tests/${exam.id()}/edit|}">Sửa</a>
          <a th:href="@{|/lecturer/tests/${exam.id()}/preview|}">Xem trước</a>
          <a th:if="${exam.status() == 'PUBLISHED'}"
             th:href="@{|/lecturer/tests/${exam.id()}/distribute|}">Phân phối</a>
          <a th:href="@{|/lecturer/tests/${exam.id()}/monitor|}">Theo dõi</a>
          <a th:href="@{|/lecturer/tests/${exam.id()}/submissions|}">Bài nộp</a>
        </td>
      </tr>
      </tbody>
    </table>
    </div>

    <div th:replace="~{fragments/pager :: pager(${examsPage}, '/lecturer/tests', ${examPagerParams})}"></div>
  </section>
</main>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/flashcard-common.js}"></script>
<script th:src="@{/js/learning-select.js}"></script>
</body>
</html>
