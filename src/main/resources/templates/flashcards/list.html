<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Thẻ ghi nhớ', ~{::link.page-css})}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/app-shell.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/flashcards.css(v='2')}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/pager.css}">
</head>
<body>
<header th:replace="~{fragments/app-header :: appHeader('flashcards')}"></header>

<span id="flash-data"
      th:attr="data-flash-success=${flashSuccess},data-flash-error=${flashError},data-flash-info=${flashInfo}"
      style="display:none;"></span>

<main class="fc-page fc-library">
  <div class="fc-toolbar">
    <h1 class="fc-visually-hidden">Thư viện của bạn</h1>
    <a class="fc-btn fc-btn-primary" th:href="@{/my/flashcards/new}">
      <svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      Tạo bộ thẻ mới
    </a>
  </div>

  <!-- Own decks -->
  <section class="fc-section">
    <h2 class="fc-section-title">Gần đây</h2>
    <div class="fc-empty" th:if="${ownDecksPage.totalElements == 0}">
      Bạn chưa có bộ thẻ nào. Nhấn <b>Tạo bộ thẻ mới</b> để bắt đầu.
    </div>
    <div id="fcOwnGrid" class="fc-grid" th:if="${ownDecksPage.totalElements > 0}">
      <article th:each="deck : ${ownDecksPage.content}" class="fc-card">
        <a class="fc-card-link" th:href="@{|/my/flashcards/${deck.id()}|}">
          <div class="fc-card-body">
            <div class="fc-card-meta">
              <strong th:text="${deck.cardCount()} + ' thuật ngữ'">0 thuật ngữ</strong>
              <span class="fc-card-divider"></span>
              <span class="fc-owner-avatar"
                    th:text="${deck.ownerName() != null and !#strings.isEmpty(deck.ownerName()) ? #strings.substring(deck.ownerName(), 0, 1) : 'K'}">K</span>
              <span class="fc-card-owner"
                    th:text="${deck.ownerName() != null ? deck.ownerName() : 'Bạn'}">Bạn</span>
              <span class="fc-owner-label">Tác giả</span>
              <span class="fc-class-label" th:if="${deck.shared()}">Đã chia sẻ</span>
            </div>
            <h3 class="fc-card-title" th:text="${deck.title()}">Tên bộ thẻ</h3>
          </div>
        </a>
        <div class="fc-card-actions">
          <a class="fc-card-share" th:href="@{|/my/flashcards/${deck.id()}#share|}"
             th:aria-label="'Chia sẻ ' + ${deck.title()}" title="Chia sẻ">
            <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"/></svg>
            <span>Chia sẻ</span>
          </a>
        </div>
      </article>
    </div>

    <!-- SSR numbered pager (own decks only); no filters to preserve → params null -->
    <div th:replace="~{fragments/pager :: pager(${ownDecksPage}, '/my/flashcards', null)}"></div>
  </section>

  <!-- Shared decks -->
  <section class="fc-section" th:unless="${#lists.isEmpty(sharedDecks)}">
    <h2 class="fc-section-title">Được chia sẻ với tôi</h2>
    <div class="fc-grid">
      <article th:each="deck : ${sharedDecks}" class="fc-card">
        <a class="fc-card-link" th:href="@{|/my/flashcards/${deck.id()}|}">
          <div class="fc-card-body">
            <div class="fc-card-meta">
              <strong th:text="${deck.cardCount()} + ' thuật ngữ'">0 thuật ngữ</strong>
              <span class="fc-card-divider"></span>
              <span class="fc-owner-avatar"
                    th:text="${deck.ownerName() != null and !#strings.isEmpty(deck.ownerName()) ? #strings.substring(deck.ownerName(), 0, 1) : 'K'}">K</span>
              <span class="fc-card-owner" th:if="${deck.ownerName() != null}"
                    th:text="${deck.ownerName()}">ai đó</span>
              <span class="fc-owner-label">Người chia sẻ</span>
              <span class="fc-class-label" th:if="${deck.className() != null}"
                    th:text="${deck.className()}">Lớp</span>
            </div>
            <h3 class="fc-card-title" th:text="${deck.title()}">Tên bộ thẻ</h3>
          </div>
        </a>
      </article>
    </div>
  </section>
</main>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/flashcard-common.js}"></script>
</body>
</html>
