<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Kích hoạt tài khoản', ~{::link.page-css})}">
    <link class="page-css" rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="page">
    <header>
        <a th:href="@{/login}" class="logo">
            <svg width="30" height="30" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="7" fill="#1E88E5"/><path d="M16 7l8 4v6c0 4.4-3.4 7.2-8 8-4.6-.8-8-3.6-8-8v-6l8-4z" fill="#fff"/><path d="M16 11l4 2-4 2-4-2 4-2z" fill="#1E88E5"/></svg>
            KSH
        </a>
    </header>
    <main class="centered">
        <div class="auth-card">
            <h1 th:if="${invalid}">Liên kết không hợp lệ</h1>
            <h1 th:unless="${invalid}">Kích hoạt tài khoản</h1>

            <div th:if="${invalid}" class="alert alert-error">
                Liên kết kích hoạt không hợp lệ hoặc đã hết hạn.
                Vui lòng liên hệ quản trị viên để nhận liên kết mới.
            </div>

            <p th:unless="${invalid}" class="text-muted text-sm" style="margin-bottom:20px;">
                Đặt mật khẩu cho tài khoản của bạn để hoàn tất kích hoạt (tối thiểu 6 ký tự).
            </p>

            <form th:unless="${invalid}" th:action="@{/activate}" method="post" th:object="${request}">
                <input type="hidden" name="token" th:value="${token}">
                <div class="field">
                    <label class="field-label" for="newPassword">Mật khẩu</label>
                    <div class="input-wrap">
                        <input id="newPassword" name="newPassword" type="password" th:field="*{newPassword}"
                               placeholder="Ít nhất 6 ký tự" autocomplete="new-password" required autofocus>
                    </div>
                    <p th:if="${#fields.hasErrors('newPassword')}" class="text-danger text-xs" style="margin-top:4px;">
                        Mật khẩu phải có ít nhất 6 ký tự
                    </p>
                </div>
                <button class="btn btn-primary" type="submit">Kích hoạt tài khoản</button>
            </form>

            <p style="margin-top:16px;text-align:center;">
                <a th:href="@{/login}" class="hint" style="color:var(--primary);">← Quay lại đăng nhập</a>
            </p>
        </div>
    </main>
</div>
</body>
</html>
