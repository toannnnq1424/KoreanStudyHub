# Local-only browser iteration profile.
#
# This profile keeps templates and static assets refreshable from the source
# tree while the task-owned spring-boot:run process remains alive. It does not
# change production cache behavior.
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
spring.web.resources.cache.cachecontrol.no-store=true
