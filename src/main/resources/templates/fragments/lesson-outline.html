<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="lessonOutline(view, activeSectionId, lessonDetail, lessonBasePath, teachingView)">
  <section class="student-lessons-outline" aria-label="Danh sách bài giảng">
    <div class="student-lessons-outline-header">
      <span>Nội dung khóa học</span>
      <span class="student-lessons-outline-count"
            th:text="${#lists.size(view.sections())} + ' chương'">0 chương</span>
    </div>

    <div class="student-lessons-outline-scroll">
      <details th:each="section : ${view.sections()}"
               class="student-lessons-outline-section"
               th:open="${section.sectionId() == activeSectionId}">
        <summary class="student-lessons-outline-section-heading">
          <svg class="student-lessons-acc-chevron" aria-hidden="true"
               viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
          <span class="student-lessons-acc-title"
                th:text="${section.title()}">Chương 1</span>
          <span class="student-lessons-acc-count"
                th:text="${teachingView} ? (${section.publishedCount()} + ' bài') : (${section.completedCount()} + '/' + ${section.publishedCount()})">0/0</span>
        </summary>

        <p class="student-lessons-outline-empty"
           th:if="${#lists.isEmpty(section.lessons())}">Chưa có bài giảng</p>

        <ul class="student-lessons-outline-list"
            th:unless="${#lists.isEmpty(section.lessons())}">
          <li th:each="lesson : ${section.lessons()}"
              class="student-lessons-outline-item"
              th:classappend="${lessonDetail != null and lesson.id() == lessonDetail.lessonId()} ? ' active' : ''">
            <a class="student-lessons-outline-link"
               th:href="${lessonBasePath + '?section=' + section.sectionId() + '&amp;lesson=' + lesson.id()}"
               th:attr="aria-current=${lessonDetail != null and lesson.id() == lessonDetail.lessonId()} ? 'page' : null">
              <span class="student-lessons-outline-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                  <polyline points="14 2 14 8 20 8"/>
                  <line x1="8" y1="13" x2="16" y2="13"/>
                  <line x1="8" y1="17" x2="16" y2="17"/>
                </svg>
              </span>
              <span class="student-lessons-outline-body">
                <span class="student-lessons-outline-title"
                      th:text="${lesson.title()}">Bài giảng</span>
                <span class="student-lessons-outline-meta"
                      th:if="${lesson.publishedAt() != null}"
                      th:text="'Đăng ' + ${#temporals.format(lesson.publishedAt(), 'dd/MM/yyyy')}">Đăng --/--/----</span>
              </span>
              <span th:if="${!teachingView}"
                    class="student-lessons-outline-status"
                    th:classappend="${lesson.completed()} ? ' is-complete' : ''"
                    th:attr="aria-label=${lesson.completed()} ? 'Đã hoàn thành' : 'Chưa hoàn thành'">
                <span th:if="${lesson.completed()}">✓</span>
              </span>
            </a>
          </li>
        </ul>
      </details>
    </div>
  </section>
</th:block>
</html>
