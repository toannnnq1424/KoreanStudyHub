spring.application.name=ksh

# ====== Local secret & features config ======
# OAuth (Google) va Mail (SMTP) settings nam CHI trong application-local.properties
# (gitignored). Khi cac property do VANG MAT, Spring Boot auto-config tu back off
# sach se -> app van khoi dong binh thuong khi chua cau hinh Google/SMTP.
# Datasource credentials cung lay tu file local do.
# (Provider URI cua Google duoc Spring Boot dien tu dong qua CommonOAuth2Provider.)
spring.config.import=optional:classpath:application-local.properties
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ====== Legacy Practice evaluator compatibility metadata ======
# Practice provider/model/credential authority is stored only in the six
# Practice AI purpose bindings. These properties retain bounded workflow and
# unit-test compatibility metadata; production transports do not select a
# provider from them.
openai.api-key=${OPENAI_API_KEY:}
openai.evaluator-model=${OPENAI_EVALUATOR_MODEL:}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.connect-timeout=${OPENAI_CONNECT_TIMEOUT:5s}
openai.read-timeout=${OPENAI_READ_TIMEOUT:60s}

# ====== Speaking transcription (8E-B, disabled by default) ======
# Language/media policy remains here. The production client resolves endpoint,
# credential, model, retries and timeouts from PRACTICE_SPEAKING_STT.
app.practice.speaking-transcription.enabled=${PRACTICE_SPEAKING_TRANSCRIPTION_ENABLED:false}
app.practice.speaking-transcription.provider=${PRACTICE_SPEAKING_TRANSCRIPTION_PROVIDER:openai}
app.practice.speaking-transcription.base-url=${OPENAI_TRANSCRIPTION_BASE_URL:https://api.openai.com/v1}
app.practice.speaking-transcription.api-key=${OPENAI_TRANSCRIPTION_API_KEY:}
app.practice.speaking-transcription.model=${OPENAI_TRANSCRIPTION_MODEL:gpt-4o-mini-transcribe}
app.practice.speaking-transcription.language=${OPENAI_TRANSCRIPTION_LANGUAGE:ko}
app.practice.speaking-transcription.max-bytes=${PRACTICE_SPEAKING_TRANSCRIPTION_MAX_BYTES:26214400}
app.practice.speaking-transcription.timeout=${PRACTICE_SPEAKING_TRANSCRIPTION_TIMEOUT:30s}
app.practice.speaking-transcription.max-retries=${PRACTICE_SPEAKING_TRANSCRIPTION_MAX_RETRIES:2}
app.practice.speaking-transcription.include-logprobs=${PRACTICE_SPEAKING_TRANSCRIPTION_INCLUDE_LOGPROBS:true}
app.practice.speaking-transcription.allowed-mime-types=${PRACTICE_SPEAKING_TRANSCRIPTION_ALLOWED_MIME_TYPES:audio/webm,audio/mp4}

# ====== Durable learner subjective evaluation ======
app.practice.attempt-evaluation.worker-enabled=${PRACTICE_ATTEMPT_EVALUATION_WORKER_ENABLED:true}
app.practice.attempt-evaluation.initial-delay=${PRACTICE_ATTEMPT_EVALUATION_INITIAL_DELAY:PT2S}
app.practice.attempt-evaluation.fixed-delay=${PRACTICE_ATTEMPT_EVALUATION_FIXED_DELAY:PT2S}
app.practice.attempt-deadline.worker-enabled=${PRACTICE_ATTEMPT_DEADLINE_WORKER_ENABLED:true}
app.practice.attempt-deadline.initial-delay=${PRACTICE_ATTEMPT_DEADLINE_INITIAL_DELAY:PT5S}
app.practice.attempt-deadline.fixed-delay=${PRACTICE_ATTEMPT_DEADLINE_FIXED_DELAY:PT5S}

# ====== Lecturer Speaking prompt authoring STT/TTS (13C3, disabled by default) ======
# This boundary is separate from learner-response transcription above.
app.practice.speaking-prompt-authoring.max-attempts=${PRACTICE_PROMPT_AI_MAX_ATTEMPTS:4}
app.practice.speaking-prompt-authoring.worker-batch-size=${PRACTICE_PROMPT_AI_WORKER_BATCH_SIZE:20}
app.practice.speaking-prompt-authoring.max-active-tasks-per-lecturer=${PRACTICE_PROMPT_AI_MAX_ACTIVE_PER_LECTURER:4}
app.practice.speaking-prompt-authoring.max-active-tasks-per-draft=${PRACTICE_PROMPT_AI_MAX_ACTIVE_PER_DRAFT:2}
app.practice.speaking-prompt-authoring.max-requests-per-lecturer-per-hour=${PRACTICE_PROMPT_AI_MAX_REQUESTS_PER_HOUR:20}
app.practice.speaking-prompt-authoring.lease-duration=${PRACTICE_PROMPT_AI_LEASE_DURATION:3m}
app.practice.speaking-prompt-authoring.manual-retry-cooldown=${PRACTICE_PROMPT_AI_MANUAL_RETRY_COOLDOWN:30s}
app.practice.speaking-prompt-authoring.retry-initial-delay=${PRACTICE_PROMPT_AI_RETRY_INITIAL_DELAY:10s}
app.practice.speaking-prompt-authoring.retry-max-delay=${PRACTICE_PROMPT_AI_RETRY_MAX_DELAY:5m}
app.practice.speaking-prompt-authoring.worker-enabled=${PRACTICE_PROMPT_AI_WORKER_ENABLED:false}
app.practice.speaking-prompt-authoring.stt.enabled=${PRACTICE_PROMPT_STT_ENABLED:false}
app.practice.speaking-prompt-authoring.stt.provider=${PRACTICE_PROMPT_STT_PROVIDER:disabled}
app.practice.speaking-prompt-authoring.stt.base-url=${PRACTICE_PROMPT_STT_BASE_URL:}
app.practice.speaking-prompt-authoring.stt.api-key=${PRACTICE_PROMPT_STT_API_KEY:}
app.practice.speaking-prompt-authoring.stt.model=${PRACTICE_PROMPT_STT_MODEL:}
app.practice.speaking-prompt-authoring.stt.language=${PRACTICE_PROMPT_STT_LANGUAGE:ko}
app.practice.speaking-prompt-authoring.stt.purpose-code=${PRACTICE_PROMPT_STT_PURPOSE:speaking_prompt_stt}
app.practice.speaking-prompt-authoring.stt.retention-code=${PRACTICE_PROMPT_STT_RETENTION:provider_default}
app.practice.speaking-prompt-authoring.stt.max-input-bytes=${PRACTICE_PROMPT_STT_MAX_BYTES:52428800}
app.practice.speaking-prompt-authoring.stt.max-input-duration=${PRACTICE_PROMPT_STT_MAX_DURATION:10m}
app.practice.speaking-prompt-authoring.stt.connect-timeout=${PRACTICE_PROMPT_STT_CONNECT_TIMEOUT:5s}
app.practice.speaking-prompt-authoring.stt.read-timeout=${PRACTICE_PROMPT_STT_READ_TIMEOUT:60s}
app.practice.speaking-prompt-authoring.stt.allowed-mime-types=${PRACTICE_PROMPT_STT_ALLOWED_MIME_TYPES:audio/mpeg,audio/wav,audio/x-wav,audio/mp4,audio/x-m4a,audio/ogg,audio/webm}
app.practice.speaking-prompt-authoring.tts.enabled=${PRACTICE_PROMPT_TTS_ENABLED:false}
app.practice.speaking-prompt-authoring.tts.provider=${PRACTICE_PROMPT_TTS_PROVIDER:disabled}
app.practice.speaking-prompt-authoring.tts.base-url=${PRACTICE_PROMPT_TTS_BASE_URL:}
app.practice.speaking-prompt-authoring.tts.api-key=${PRACTICE_PROMPT_TTS_API_KEY:}
app.practice.speaking-prompt-authoring.tts.model=${PRACTICE_PROMPT_TTS_MODEL:}
app.practice.speaking-prompt-authoring.tts.language=${PRACTICE_PROMPT_TTS_LANGUAGE:ko}
app.practice.speaking-prompt-authoring.tts.voice=${PRACTICE_PROMPT_TTS_VOICE:default}
app.practice.speaking-prompt-authoring.tts.speed=${PRACTICE_PROMPT_TTS_SPEED:1.0}
app.practice.speaking-prompt-authoring.tts.output-format=${PRACTICE_PROMPT_TTS_OUTPUT_FORMAT:mp3}
app.practice.speaking-prompt-authoring.tts.max-input-characters=${PRACTICE_PROMPT_TTS_MAX_INPUT_CHARACTERS:16000}
app.practice.speaking-prompt-authoring.tts.purpose-code=${PRACTICE_PROMPT_TTS_PURPOSE:speaking_prompt_tts}
app.practice.speaking-prompt-authoring.tts.retention-code=${PRACTICE_PROMPT_TTS_RETENTION:provider_default}
app.practice.speaking-prompt-authoring.orphan-retention=${PRACTICE_PROMPT_ORPHAN_RETENTION:P30D}
app.practice.speaking-prompt-authoring.cleanup-worker-enabled=${PRACTICE_PROMPT_CLEANUP_WORKER_ENABLED:true}
app.practice.speaking-prompt-authoring.cleanup-initial-delay=${PRACTICE_PROMPT_CLEANUP_INITIAL_DELAY:PT2M}
app.practice.speaking-prompt-authoring.cleanup-fixed-delay=${PRACTICE_PROMPT_CLEANUP_FIXED_DELAY:PT15M}
app.practice.speaking-prompt-authoring.tts.max-output-bytes=${PRACTICE_PROMPT_TTS_MAX_BYTES:52428800}
app.practice.speaking-prompt-authoring.tts.max-output-duration=${PRACTICE_PROMPT_TTS_MAX_DURATION:10m}
app.practice.speaking-prompt-authoring.tts.connect-timeout=${PRACTICE_PROMPT_TTS_CONNECT_TIMEOUT:5s}
app.practice.speaking-prompt-authoring.tts.read-timeout=${PRACTICE_PROMPT_TTS_READ_TIMEOUT:90s}
app.practice.speaking-prompt-authoring.tts.allowed-output-formats=${PRACTICE_PROMPT_TTS_ALLOWED_FORMATS:mp3,wav}
app.practice.speaking-prompt-authoring.tts.allowed-output-mime-types=${PRACTICE_PROMPT_TTS_ALLOWED_MIME_TYPES:audio/mpeg,audio/wav,audio/x-wav}

# ====== Speaking evaluator (8E-C, disabled by default) ======
# Prompt/rubric/schema policy remains here. Production provider/model/key
# authority comes only from PRACTICE_SPEAKING_EVALUATION.
app.practice.speaking-evaluator.enabled=${PRACTICE_SPEAKING_EVALUATOR_ENABLED:false}
app.practice.speaking-evaluator.provider=${PRACTICE_SPEAKING_EVALUATOR_PROVIDER:openai-primary}
app.practice.speaking-evaluator.base-url=${PRACTICE_SPEAKING_EVALUATOR_BASE_URL:}
app.practice.speaking-evaluator.api-key=${PRACTICE_SPEAKING_EVALUATOR_API_KEY:}
app.practice.speaking-evaluator.model=${PRACTICE_SPEAKING_EVALUATOR_MODEL:}
app.practice.speaking-evaluator.timeout=${PRACTICE_SPEAKING_EVALUATOR_TIMEOUT:30s}
app.practice.speaking-evaluator.max-retries=${PRACTICE_SPEAKING_EVALUATOR_MAX_RETRIES:2}
app.practice.speaking-evaluator.prompt-version=${PRACTICE_SPEAKING_EVALUATOR_PROMPT_VERSION:}
app.practice.speaking-evaluator.rubric-version=${PRACTICE_SPEAKING_EVALUATOR_RUBRIC_VERSION:}
app.practice.speaking-evaluator.schema-version=${PRACTICE_SPEAKING_EVALUATOR_SCHEMA_VERSION:}
app.practice.speaking-evaluator.text-fallback-enabled=${PRACTICE_SPEAKING_EVALUATOR_TEXT_FALLBACK_ENABLED:false}

# Show the full PDF -> AI -> DB pipeline in the console while developing.
logging.level.com.ksh.features.practice=INFO

# ====== Korea Discovery news flow ======
# Metadata-only ingestion from the allowlisted official sources in Flyway V68.
# fixed-delay runs five hours after the previous run finishes (no midnight gap).
app.news.ingestion.enabled=${NEWS_INGESTION_ENABLED:false}
app.news.ingestion.initial-delay=${NEWS_INGESTION_INITIAL_DELAY:PT2M}
app.news.ingestion.fixed-delay=${NEWS_INGESTION_FIXED_DELAY:PT5H}
app.news.http.connect-timeout=${NEWS_HTTP_CONNECT_TIMEOUT:5s}
app.news.http.read-timeout=${NEWS_HTTP_READ_TIMEOUT:20s}

# Korean Basic Dictionary Open API. AI is deliberately not required in this phase.
# Register for a key at https://krdict.korean.go.kr/eng/openApi/openApiInfo
app.news.dictionary.api-key=${KOREAN_DICTIONARY_API_KEY:}
app.news.dictionary.base-url=${KOREAN_DICTIONARY_BASE_URL:https://krdict.korean.go.kr/api/search}
app.news.dictionary.batch-size=${KOREAN_DICTIONARY_BATCH_SIZE:12}
app.news.ingestion.backfill-pages-per-run=${NEWS_BACKFILL_PAGES_PER_RUN:4}

# Reserved switch for the later Korean -> Vietnamese AI translation phase.
app.news.ai-translation.enabled=${NEWS_AI_TRANSLATION_ENABLED:false}
app.news.raw-preview-enabled=${NEWS_RAW_PREVIEW_ENABLED:false}

# ====== Upload ======
# Keep local objects outside the Git worktree so switching branches/worktrees
# never makes existing uploads disappear. Production can still switch writes
# to R2 from Admin > System settings > Storage; this root remains the dual-read
# fallback for objects created before the provider switch.
app.data.dir=${KSH_DATA_DIR:${user.home}/.ksh}
app.upload.dir=${UPLOAD_DIR:${app.data.dir}/uploads}
# LOCAL storage profiles are an explicit development/test opt-in. Production
# therefore fails closed when an R2 profile is missing or incomplete.
app.storage-profiles.allow-local=${STORAGE_PROFILES_ALLOW_LOCAL:false}
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# ====== Audio / Media Storage ======
# provider: "local" (default, serve from /static/audio/) or "r2" (Cloudflare R2)
storage.provider=${STORAGE_PROVIDER:local}
storage.local.base-url=${STORAGE_LOCAL_BASE_URL:/audio}
# R2 secrets -> set in application-local.properties or env vars (NEVER commit to git)
# storage.r2.account-id=
# storage.r2.access-key=
# storage.r2.secret-key=
# storage.r2.bucket=ksh-audio
# storage.r2.public-domain=https://audio.ksh.edu.vn


# ====== Datasource (MySQL 8.0) ======
# Credential lay tu bien moi truong / application-local.properties - KHONG hardcode secret o day
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ksh_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ====== JPA / Hibernate ======
# Flyway so huu schema -> Hibernate CHI validate, KHONG tu sua bang
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Bat sang true khi can debug SQL
spring.jpa.show-sql=false

# Performance tuning (Wave 1 perf audit)
# Batch INSERT/UPDATE statements for audit logs and bulk operations
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Avoid N+1 on LAZY collections by fetching in batches when triggered
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# ====== Flyway migration ======
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true


# ====== Thymeleaf ======
# Tat cache khi dev de thay doi template lap tuc; bat lai khi production
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ====== Server ======
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Speaking media APIs and cleanup worker remain opt-in until phase-gate approval.
app.practice.speaking-media.upload-api-enabled=${PRACTICE_SPEAKING_MEDIA_UPLOAD_API_ENABLED:false}
app.practice.speaking-media.playback-api-enabled=${PRACTICE_SPEAKING_MEDIA_PLAYBACK_API_ENABLED:false}
app.practice.speaking-media.cleanup-worker-enabled=${PRACTICE_SPEAKING_MEDIA_CLEANUP_WORKER_ENABLED:false}
app.practice.speaking-media.cleanup-worker-fixed-delay=${PRACTICE_SPEAKING_MEDIA_CLEANUP_WORKER_FIXED_DELAY:PT5M}
app.practice.speaking-media.cleanup-worker-batch-size=${PRACTICE_SPEAKING_MEDIA_CLEANUP_WORKER_BATCH_SIZE:100}
app.practice.speaking-media.cleanup-lease-duration=${PRACTICE_SPEAKING_MEDIA_CLEANUP_LEASE_DURATION:PT5M}

# PDF import AI stays bounded even when the outer multipart limit is larger.
app.practice.pdf-ai.max-selected-pages=${PRACTICE_PDF_AI_MAX_SELECTED_PAGES:50}
app.practice.pdf-ai.max-text-characters=${PRACTICE_PDF_AI_MAX_TEXT_CHARACTERS:1000000}

# Reading/Listening explanations are prepared after publish and generated by a bounded worker.
app.practice.explanation-generation.worker-enabled=${PRACTICE_EXPLANATION_WORKER_ENABLED:true}
app.practice.explanation-generation.initial-delay=${PRACTICE_EXPLANATION_WORKER_INITIAL_DELAY:PT20S}
app.practice.explanation-generation.fixed-delay=${PRACTICE_EXPLANATION_WORKER_FIXED_DELAY:PT30S}
app.practice.explanation-generation.provider-timeout=${PRACTICE_EXPLANATION_PROVIDER_TIMEOUT:60s}
app.practice.explanation-generation.reconcile-initial-delay=${PRACTICE_EXPLANATION_RECONCILE_INITIAL_DELAY:PT45S}
app.practice.explanation-generation.reconcile-fixed-delay=${PRACTICE_EXPLANATION_RECONCILE_FIXED_DELAY:PT2M}
